[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uavsec"
version = "0.1.0"
description = "Reproduction of 'Deep Graph Reinforcement Learning for UAV-Enabled Multi-User Secure Communications' (Tang et al., IEEE TMC 2025)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "gymnasium>=1.0,<1.3",
    "stable-baselines3>=2.5",
    "imageio",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
