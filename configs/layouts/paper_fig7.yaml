# Ground-node layout read off Fig. 7 of Tang et al. (TMC 2025), in metres.
# Coordinates were digitised from the printed figure (about +-1 m accuracy).
# eves[k] is the eavesdropper associated with users[k]. The paper does not state the
# pairing, so each eavesdropper is paired with a nearby user so that the distances
# stay close to the "about 20 m" of Sec. VI (see scripts/plot_layout.py for the check).
# The user hidden behind the legend in the paper's figure is users[2] at (137, 143).
